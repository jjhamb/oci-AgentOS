<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SIP Softphone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; min-height:100vh; padding:20px; }
  .card { background:#1e293b; border:1px solid rgba(148,163,184,.15);
          border-radius:16px; padding:28px; width:100%; max-width:340px; }
  h2 { font-size:1em; color:#a78bfa; margin-bottom:16px; text-align:center; }
  .status { text-align:center; margin-bottom:16px; font-size:.85em;
            padding:8px; border-radius:8px; background:rgba(0,0,0,.3); }
  .status.ok { color:#34d399; } .status.err { color:#f87171; }
  .status.warn { color:#fbbf24; }
  input { width:100%; background:rgba(15,23,42,.7); border:1px solid rgba(148,163,184,.2);
          border-radius:8px; padding:9px 12px; color:#e2e8f0; font-size:.9em;
          margin-bottom:10px; outline:none; }
  input:focus { border-color:#7c3aed; }
  .btn { width:100%; padding:11px; border:none; border-radius:8px;
         font-size:.9em; font-weight:600; cursor:pointer; margin-bottom:8px;
         transition:all .15s; font-family:inherit; }
  .btn-reg  { background:linear-gradient(135deg,#7c3aed,#6d28d9); color:#fff; }
  .btn-call { background:rgba(52,211,153,.2); color:#34d399; border:1px solid rgba(52,211,153,.3); }
  .btn-hang { background:rgba(239,68,68,.2); color:#f87171; border:1px solid rgba(239,68,68,.3); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .dialpad { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
  .dialpad button { padding:10px; border:1px solid rgba(148,163,184,.2); border-radius:8px;
         background:rgba(15,23,42,.7); color:#e2e8f0; font-size:1em; cursor:pointer;
         transition:all .15s; font-family:inherit; }
  .dialpad button:hover { background:#334155; }
  .dialpad button:active { background:#1e293b; transform:scale(.95); }
  .log { margin-top:12px; max-height:180px; overflow-y:auto;
         background:rgba(0,0,0,.3); border-radius:8px; padding:8px; font-size:.78em; }
  .log div { padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05); color:#94a3b8; }
  .log div.err { color:#f87171; } .log div.ok { color:#34d399; }
  audio { display:none; }
</style>
</head>
<body>
<div class="card">
  <h2>☎️ SIP Softphone</h2>
  <div class="status warn" id="status">Idle — not registered</div>
  <input id="wsUrl"    placeholder="wss://sip.server:8443/ws" value="ws://127.0.0.1:51764/ws/sip">
  <input id="sipUser"  placeholder="username / extension"     value="4334785">
  <input id="sipPass"  type="password" placeholder="password" value="123456">
  <input id="sipDn"    placeholder="Display name"             value="jjhamb">
  <input id="sipDomain" placeholder="SIP domain"             value="localphone.com">
  <input id="dialNum"  placeholder="Dial: 1002 or sip:1002@domain" value="">
  <div class="dialpad">
    <button data-dial="1">1</button>
    <button data-dial="2">2</button>
    <button data-dial="3">3</button>
    <button data-dial="4">4</button>
    <button data-dial="5">5</button>
    <button data-dial="6">6</button>
    <button data-dial="7">7</button>
    <button data-dial="8">8</button>
    <button data-dial="9">9</button>
    <button data-dial="*">*</button>
    <button data-dial="0">0</button>
    <button data-dial="#">#</button>
  </div>
  <button class="btn btn-reg"  id="btnReg">🔗 Register</button>
  <button class="btn btn-call" id="btnCall" disabled>📞 Call</button>
  <button class="btn btn-hang" id="btnHang" disabled>🔴 Hang Up</button>
  <div class="log" id="log"></div>
</div>
<audio id="remoteAudio" autoplay></audio>
<script type="module">
        import * as SIP from 'http://127.0.0.1:51764/static/sip-0.21.2.min.js?v=3';
/* ── Gateway WS URL (SIP/2.0 over WebSocket, used when WSS direct not available) ──
   Normally SIP.js connects directly to the WSS SIP server.
   GW_WS_URL is our Python bridge — used only as fallback or for UDP-only servers. */
const GW_WS_URL = "ws://127.0.0.1:51764/ws/sip";

let ua = null;
let currentSession = null;

function log(msg, cls) {
  const d = document.getElementById('log');
  if (!d) return;
  const el = document.createElement('div');
  el.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  if (cls) el.className = cls;
  d.insertBefore(el, d.firstChild);
  while (d.children.length > 80) d.removeChild(d.lastChild);
  // Also log to browser console for external capture
  console.log('[SIP debug] ' + msg);
}

// Global error catcher
window.addEventListener('error', function(e) {
  console.error('[SIP ERROR] ' + e.message + ' at ' + e.filename + ':' + e.lineno);
  var d = document.getElementById('log');
  if (d) {
    var el = document.createElement('div');
    el.className = 'err';
    el.textContent = new Date().toLocaleTimeString() + ' ERROR: ' + e.message;
    d.insertBefore(el, d.firstChild);
  }
});

// Self-test: does this script even run?
console.log('[SIP] Script block executing, SIP loaded:', typeof SIP !== 'undefined');
document.title = 'SIP loaded: ' + (typeof SIP !== 'undefined');

log('Page loaded, GW_WS_URL=' + (typeof GW_WS_URL !== 'undefined' ? GW_WS_URL : 'NOT SET'));
log('SIP.js available: ' + (typeof SIP !== 'undefined'));
log('wsUrl input value: [' + (document.getElementById('wsUrl') || {}).value + ']');
log('SIP.js version: ' + (typeof SIP !== 'undefined' ? (SIP.version || 'unknown') : 'NOT LOADED'));

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (cls || 'warn');
}

function doRegister() {
  if (ua) { try { ua.stop(); } catch(e){} ua = null; }

  const wsUrl  = document.getElementById('wsUrl').value.trim() || GW_WS_URL;
  const user   = document.getElementById('sipUser').value.trim();
  const pass   = document.getElementById('sipPass').value;
  const dn     = document.getElementById('sipDn').value.trim() || user;
  const domain = document.getElementById('sipDomain').value.trim();

  if (!user || !domain) { setStatus('Username and domain required', 'err'); return; }

  setStatus('Registering…');
  log('wsUrl input: [' + document.getElementById('wsUrl').value.trim() + ']');
  log('GW_WS_URL: [' + GW_WS_URL + ']');
  log('Connecting to ' + wsUrl);
  log('SIP.js version: ' + (SIP.version || 'unknown'));
  log('URI: sip:' + user + '@' + domain);
  log('transportOptions: ' + JSON.stringify({ server: wsUrl }));

  // Expose debug function to call from browser console
  window.__sipDebug = function() {
    return {
      wsUrl, GW_WS_URL, user, domain,
      ua: ua ? { started: true, transport: ua.transport ? { connected: ua.transport.connected } : null } : null,
      sipjs: SIP.version
    };
  };

  const config = {
    uri: SIP.UserAgent.makeURI('sip:' + user + '@' + domain),
    transportOptions: { server: wsUrl },
    authorizationUsername: user,
    authorizationPassword: pass,
    displayName: dn,
    sessionDescriptionHandlerFactoryOptions: {
      peerConnectionConfiguration: {
        iceServers: [{ urls: 'stun:' }]
      }
    },
    logLevel: 'warn',
    delegate: {
      onInvite(invitation) {
        log('Incoming call from ' + invitation.remoteIdentity.displayName, 'ok');
        currentSession = invitation;
        invitation.accept({ sessionDescriptionHandlerOptions: { constraints: { audio: true, video: false } } })
          .then(() => {
            setStatus('📞 In call (incoming)', 'ok');
            log('Call accepted', 'ok');
            wireAudio(invitation);
            document.getElementById('btnHang').disabled = false;
          }).catch(e => log('Accept error: ' + e, 'err'));
      }
    }
  };

  try {
    ua = new SIP.UserAgent(config);

    // Debug: monitor transport events
    ua.transport.onConnect = () => { log('Transport: CONNECTED', 'ok'); };
    ua.transport.onDisconnect = (error) => { log('Transport: DISCONNECTED' + (error ? ' (' + error + ')' : ''), 'warn'); };
    ua.transport.onMessage = (msg) => { log('Transport: MSG ' + msg.byteLength + ' bytes', 'dbg'); };

    const registerer = new SIP.Registerer(ua);

    registerer.stateChange.addListener(state => {
      log('Registerer state: ' + state);
      if (state === SIP.RegistererState.Registered) {
        setStatus('✅ Registered as ' + user + '@' + domain, 'ok');
        log('Registered OK', 'ok');
        document.getElementById('btnCall').disabled = false;
      } else if (state === SIP.RegistererState.Unregistered) {
        setStatus('Unregistered', 'warn');
        document.getElementById('btnCall').disabled = true;
      }
    });

    log('Calling ua.start()...');
    ua.start().then(() => {
      log('ua.start() resolved, calling registerer.register()...');
      registerer.register();
    }).catch(e => {
      setStatus('Connect error', 'err');
      log('UA start REJECTED: ' + e + (e.stack ? '\n' + e.stack : ''), 'err');
    });
  } catch(e) {
    setStatus('Init error', 'err');
    log('Init catch: ' + e + (e.stack ? '\n' + e.stack : ''), 'err');
  }
}

function doCall() {
  const target = document.getElementById('dialNum').value.trim();
  if (!target || !ua) return;
  const domain = document.getElementById('sipDomain').value.trim();
  const uri = target.startsWith('sip:') ? target : 'sip:' + target + '@' + domain;

  log('Calling ' + uri + '…', 'ok');
  setStatus('📞 Calling ' + target + '…', 'warn');

  const inviter = new SIP.Inviter(ua, SIP.UserAgent.makeURI(uri), {
    sessionDescriptionHandlerOptions: { constraints: { audio: true, video: false } }
  });

  inviter.stateChange.addListener(state => {
    log('Session: ' + state);
    if (state === SIP.SessionState.Established) {
      setStatus('📞 In call with ' + target, 'ok');
      wireAudio(inviter);
      document.getElementById('btnHang').disabled = false;
      document.getElementById('btnCall').disabled = true;
    } else if (state === SIP.SessionState.Terminated) {
      setStatus('Call ended', 'warn');
      document.getElementById('btnHang').disabled = true;
      document.getElementById('btnCall').disabled = false;
    }
  });

  inviter.invite().catch(e => { log('INVITE error: ' + e, 'err'); setStatus('Call failed', 'err'); });
  currentSession = inviter;
}

function doHangup() {
  if (!currentSession) return;
  try {
    if (currentSession.state === SIP.SessionState.Established) currentSession.bye();
    else currentSession.cancel ? currentSession.cancel() : currentSession.reject();
  } catch(e) { log('Hangup error: ' + e, 'err'); }
  currentSession = null;
  setStatus('Call ended', 'warn');
  document.getElementById('btnHang').disabled = true;
  document.getElementById('btnCall').disabled = false;
}

function dial(digit) {
  const inp = document.getElementById('dialNum');
  inp.value += digit;
  inp.focus();
}

function wireAudio(session) {
  session.sessionDescriptionHandler.peerConnection.getReceivers().forEach(receiver => {
    if (receiver.track && receiver.track.kind === 'audio') {
      const stream = new MediaStream([receiver.track]);
      document.getElementById('remoteAudio').srcObject = stream;
    }
  });
}

// Attach event listeners (module scripts are deferred — DOM is ready)
document.getElementById('btnReg').addEventListener('click', doRegister);
document.getElementById('btnCall').addEventListener('click', doCall);
document.getElementById('btnHang').addEventListener('click', doHangup);
document.querySelectorAll('[data-dial]').forEach(btn => {
  btn.addEventListener('click', () => dial(btn.dataset.dial));
});

// Auto-register on page load
setTimeout(doRegister, 300);
</script>
</body>
</html>
