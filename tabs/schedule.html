<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes AgentOS — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ═══════════ DESIGN TOKENS ═══════════ */
  :root {
    --bg-base: #15151F;
    --bg-glass: rgba(31,31,43,0.55);
    --border-glass: rgba(255,255,255,0.1);
    --text-primary: #F4F4F8;
    --text-muted: #8A8A9B;
    --brand-violet: #8B5CF6;
    --brand-violet-glow: #A78BFA;
    --brand-cyan: #7DD3FC;
    --brand-mint: #5EE2B5;
    --brand-amber: #F5B544;
    --brand-red: #F26D6D;
    --brand-pink: #F472B6;
    --brand-gold: #FBBF24;
    --brand-magenta: #E879F9;
    --brand-teal: #2DD4BF;
    --font-display: 'Inter Tight', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-size-xs: 10px;
    --font-size-sm: 12px;
    --font-size-base: 14px;
    --font-size-lg: 18px;
    --font-size-xl: 22px;
    --letter-spacing-wide: 0.15em;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 16px;
    --space-4: 24px;
    --space-5: 32px;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-full: 999px;
    --blur-light: blur(4px);
    --blur-medium: blur(8px);
    --blur-heavy: blur(16px);
    --transition-fast: 150ms ease;
    --transition-normal: 250ms ease;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-mono);
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Ambient Background ── */
  .bg-orb { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-orb::before, .bg-orb::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5;
  }
  .bg-orb::before {
    width: 600px; height: 600px; top: -10%; left: -5%;
    background: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
    animation: float-orb 12s ease-in-out infinite alternate;
  }
  .bg-orb::after {
    width: 500px; height: 500px; bottom: -15%; right: -5%;
    background: radial-gradient(circle, rgba(125,211,252,0.25), transparent 70%);
    animation: float-orb 15s ease-in-out infinite alternate-reverse;
  }
  @keyframes float-orb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 20px) scale(1.05); }
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  /* ── Top Nav Bar ── */
  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-2) var(--space-4);
    background: rgba(21, 21, 31, 0.5);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }
  .brand { display: flex; align-items: center; gap: var(--space-2); }
  .brand-mark {
    position: relative; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--brand-violet), var(--brand-cyan), var(--brand-mint), var(--brand-violet));
    box-shadow: 0 0 16px rgba(139,92,246,0.4), 0 0 40px rgba(139,92,246,0.15);
    animation: spin-ring 8s linear infinite;
  }
  @keyframes spin-ring { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .brand-inner { position: absolute; inset: 4px; border-radius: 50%; background: var(--bg-base); }
  .brand-dot {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--brand-mint); z-index: 2;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 4px 2px rgba(94,226,181,0.4); transform: scale(1); }
    50% { box-shadow: 0 0 10px 6px rgba(94,226,181,0.15); transform: scale(1.15); }
  }
  .brand-name {
    font-family: var(--font-display); font-weight: 700; font-size: var(--font-size-lg);
    background: linear-gradient(135deg, var(--brand-violet-glow), var(--brand-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .tab-row {
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-full); padding: 3px;
  }
  .tab-btn {
    padding: var(--space-1) var(--space-3); border: none; background: transparent;
    color: var(--text-muted); font-family: var(--font-mono);
    font-size: var(--font-size-sm); font-weight: 500;
    border-radius: var(--radius-full); cursor: pointer;
    transition: all var(--transition-fast); white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
  .tab-btn.active { background: rgba(255,255,255,0.92); color: var(--bg-base); font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .nav-right { display: flex; align-items: center; gap: var(--space-3); }
  .status-pill {
    display: flex; align-items: center; gap: var(--space-1);
    padding: 5px var(--space-2);
    background: rgba(94,226,181,0.1); border: 1px solid rgba(94,226,181,0.25);
    border-radius: var(--radius-full); font-size: var(--font-size-xs);
    color: var(--brand-mint); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-mint); animation: pulse-dot 2s ease-in-out infinite; }
  .nav-clock { font-family: var(--font-mono); font-size: var(--font-size-sm); color: var(--text-muted); letter-spacing: 0.05em; }

  /* ── Main ── */
  .main { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: var(--space-4); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Glass Card ── */
  .glass-card {
    background: rgba(31,31,43,0.5);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* ═══════════════════════════════════════════
     SCHEDULE TAB
     ═══════════════════════════════════════════ */

  .schedule-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: var(--space-4);
  }
  .schedule-eyebrow {
    font-family: var(--font-mono); font-size: var(--font-size-xs);
    color: var(--text-muted); letter-spacing: var(--letter-spacing-wide); text-transform: uppercase;
  }
  .schedule-title {
    font-family: var(--font-display); font-size: clamp(36px, 4vw, 60px);
    font-weight: 500; color: var(--text-primary); line-height: 1.1; margin-top: var(--space-1);
  }
  .schedule-refresh { display: flex; align-items: center; gap: var(--space-1); font-size: var(--font-size-xs); color: var(--text-muted); }
  .schedule-refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-mint); animation: pulse-dot 2s ease-in-out infinite; }

  .schedule-section { margin-bottom: var(--space-5); }
  .schedule-section:last-child { margin-bottom: 0; }

  .section-eyebrow {
    font-family: var(--font-mono); font-size: var(--font-size-xs);
    color: var(--brand-violet-glow); letter-spacing: var(--letter-spacing-wide);
    text-transform: uppercase; margin-bottom: var(--space-3);
    display: flex; align-items: center; gap: var(--space-2);
  }
  .section-eyebrow::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(139,92,246,0.3), transparent);
  }
  .section-count {
    font-size: 10px; color: var(--text-muted);
    background: rgba(255,255,255,0.06); padding: 1px 6px;
    border-radius: var(--radius-full); margin-left: auto;
  }

  .job-card {
    background: rgba(31,31,43,0.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 3px solid var(--brand-violet);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-2);
    transition: all var(--transition-normal);
  }
  .job-card:hover {
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .job-card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: var(--space-3); margin-bottom: var(--space-2);
  }
  .job-owner-badge {
    font-family: var(--font-mono); font-size: 9px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 8px; border-radius: var(--radius-sm); flex-shrink: 0;
  }
  .job-owner-hermes { background: rgba(139,92,246,0.15); color: var(--brand-violet-glow); border: 1px solid rgba(139,92,246,0.3); }
  .job-owner-system { background: rgba(138,138,155,0.15); color: var(--text-muted); border: 1px solid rgba(138,138,155,0.3); }
  .job-owner-error { background: rgba(242,109,109,0.15); color: var(--brand-red); border: 1px solid rgba(242,109,109,0.3); }

  .job-command {
    font-family: var(--font-mono); font-size: var(--font-size-sm);
    color: var(--text-primary); line-height: 1.5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default; position: relative;
  }
  .job-command:hover { white-space: pre-wrap; word-break: break-all; }
  .job-card-schedule {
    display: flex; align-items: center; gap: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .job-schedule-badge {
    font-family: var(--font-mono); font-size: var(--font-size-xs);
    color: var(--brand-cyan); background: rgba(125,211,252,0.08);
    border: 1px solid rgba(125,211,252,0.15);
    padding: 2px 8px; border-radius: var(--radius-sm);
  }
  .job-schedule-english {
    font-size: var(--font-size-xs); color: var(--text-muted);
  }
  .job-source {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--text-muted); opacity: 0.5;
    margin-top: var(--space-2); padding-top: var(--space-2);
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .job-error-msg {
    font-size: var(--font-size-xs); color: var(--brand-red);
    margin-top: var(--space-1);
  }

  .schedule-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 120px; color: var(--text-muted); font-size: var(--font-size-sm);
    opacity: 0.5; border: 1px dashed rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .nav { flex-wrap: wrap; gap: var(--space-2); }
    .tab-row { order: 3; width: 100%; overflow-x: auto; }
    .job-card-header { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="bg-orb"></div>
<div class="bg-grid"></div>

<nav class="nav">
  <div class="brand">
    <div class="brand-mark">
      <div class="brand-ring"></div>
      <div class="brand-inner"></div>
      <div class="brand-dot"></div>
    </div>
    <span class="brand-name">Hermes AgentOS</span>
  </div>
  <div class="tab-row">
    <button class="tab-btn" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="agents">Agents</button>
    <button class="tab-btn" data-tab="tasks">Tasks</button>
    <button class="tab-btn active" data-tab="schedule">Schedule</button>
    <button class="tab-btn" data-tab="content">Content</button>
    <button class="tab-btn" data-tab="terminal">Terminal</button>
  </div>
  <div class="nav-right">
    <div class="status-pill"><div class="status-dot"></div><span>Live</span></div>
    <span class="nav-clock" id="navClock">--:--:--</span>
  </div>
</nav>

<div class="main">
  <!-- ── Overview placeholder ── -->
  <div class="tab-panel" id="panel-overview">
    <div class="glass-card"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);gap:8px;">
      <div style="font-size:48px;opacity:.3">📊</div>
      <div>Overview — mission control dashboard</div>
    </div></div>
  </div>

  <!-- ── Agents placeholder ── -->
  <div class="tab-panel" id="panel-agents">
    <div class="glass-card"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);gap:8px;">
      <div style="font-size:48px;opacity:.3">🤖</div>
      <div>Agents — crew diagram + activity</div>
    </div></div>
  </div>

  <!-- ── Tasks placeholder ── -->
  <div class="tab-panel" id="panel-tasks">
    <div class="glass-card"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);gap:8px;">
      <div style="font-size:48px;opacity:.3">✅</div>
      <div>Tasks — live kanban board</div>
    </div></div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCHEDULE TAB
       ═══════════════════════════════════════════ -->
  <div class="tab-panel active" id="panel-schedule">
    <div class="schedule-header">
      <div>
        <div class="schedule-eyebrow">Mission Control</div>
        <div class="schedule-title">Schedule</div>
      </div>
      <div class="schedule-refresh">
        <div class="schedule-refresh-dot"></div>
        <span id="scheduleStatus">Loading…</span>
      </div>
    </div>

    <!-- Hermes Jobs Section -->
    <div class="schedule-section" id="section-hermes">
      <div class="section-eyebrow">Hermes Jobs<span class="section-count" id="count-hermes">0</span></div>
      <div id="jobs-hermes"></div>
    </div>

    <!-- System Jobs Section -->
    <div class="schedule-section" id="section-system">
      <div class="section-eyebrow">System Jobs<span class="section-count" id="count-system">0</span></div>
      <div id="jobs-system"></div>
    </div>
  </div>

  <!-- ── Content placeholder ── -->
  <div class="tab-panel" id="panel-content">
    <div class="glass-card"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);gap:8px;">
      <div style="font-size:48px;opacity:.3">📁</div>
      <div>Content — documents + storage</div>
    </div></div>
  </div>

  <!-- ── Terminal placeholder ── -->
  <div class="tab-panel" id="panel-terminal">
    <div class="glass-card"><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;color:var(--text-muted);gap:8px;">
      <div style="font-size:48px;opacity:.3">💻</div>
      <div>Terminal — command execution</div>
    </div></div>
  </div>
</div>

<script>
  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // Clock
  function updateClock() {
    document.getElementById('navClock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ═══════════════════════════════════════════
  // SCHEDULE TAB
  // ═══════════════════════════════════════════

  const DEMO_CRON = [
    { source: "~/.hermes/cron/jobs.json", label: "hermes", name: "Kanban Health Audit (30min)", schedule_raw: "every 30m", schedule_english: "Every 30 minutes", command: "python3 /hermes/scripts/kanban-audit.py", owner: "hermes" },
    { source: "~/.hermes/cron/jobs.json", label: "hermes", name: "Monthly Log Cleanup", schedule_raw: "0 3 1 * *", schedule_english: "At 3:00 AM on the 1st of each month", command: "bash /hermes/agents/_shared/monthly-log-cleanup.sh", owner: "hermes" },
    { source: "/etc/crontab", label: "system", schedule_raw: "17 * * * *", schedule_english: "Every hour at minute 17", command: "cd / && run-parts --report /etc/cron.hourly", owner: "system" },
    { source: "/etc/crontab", label: "system", schedule_raw: "25 6 * * *", schedule_english: "At 6:25 AM daily", command: "test -x /usr/sbin/anacron || run-parts /etc/cron.daily", owner: "system" },
    { source: "/etc/crontab", label: "system", schedule_raw: "47 6 * * 7", schedule_english: "At 6:47 AM on Sundays", command: "test -x /usr/sbin/anacron || run-parts /etc/cron.weekly", owner: "system" },
    { source: "/etc/crontab", label: "system", schedule_raw: "52 6 1 * *", schedule_english: "At 6:52 AM on the 1st", command: "test -x /usr/sbin/anacron || run-parts /etc/cron.monthly", owner: "system" },
  ];

  const isStandalone = location.protocol === 'file:';

  function renderSchedule(jobs) {
    const hermesEl = document.getElementById('jobs-hermes');
    const systemEl = document.getElementById('jobs-system');
    const hermesCount = document.getElementById('count-hermes');
    const systemCount = document.getElementById('count-system');

    // Separate hermes vs system jobs
    // Hermes jobs: from jobs.json (source contains .json or label=hermes)
    // System jobs: from /etc/crontab, /etc/cron.d, etc.
    const hermesJobs = [];
    const systemJobs = [];

    jobs.forEach(job => {
      if (job.error) {
        // Permission errors etc — show in system
        systemJobs.push(job);
      } else if (job.source && (job.source.endsWith('.json') || job.label === 'hermes')) {
        hermesJobs.push(job);
      } else {
        systemJobs.push(job);
      }
    });

    hermesCount.textContent = hermesJobs.length;
    systemCount.textContent = systemJobs.length;

    if (hermesJobs.length === 0) {
      hermesEl.innerHTML = '<div class="schedule-empty">No scheduled jobs in this group.</div>';
    } else {
      hermesEl.innerHTML = hermesJobs.map(job => buildJobCard(job, 'hermes')).join('');
    }

    if (systemJobs.length === 0) {
      systemEl.innerHTML = '<div class="schedule-empty">No scheduled jobs in this group.</div>';
    } else {
      systemEl.innerHTML = systemJobs.map(job => buildJobCard(job, 'system')).join('');
    }

    document.getElementById('scheduleStatus').textContent = 'Live · ' + jobs.length + ' jobs';
  }

  function buildJobCard(job, type) {
    if (job.error) {
      return `<div class="job-card" style="border-left-color:var(--brand-red)">
        <div class="job-card-header">
          <span class="job-owner-badge job-owner-error">⚠ Error</span>
        </div>
        <div class="job-command">${escapeHtml(job.source)}</div>
        <div class="job-error-msg">${escapeHtml(job.error)}</div>
      </div>`;
    }

    const ownerClass = type === 'hermes' ? 'job-owner-hermes' : 'job-owner-system';
    const ownerLabel = type === 'hermes' ? 'HERMES' : 'SYSTEM';

    return `<div class="job-card">
      <div class="job-card-header">
        <div class="job-command" title="${escapeHtml(job.command)}">${escapeHtml(job.command)}</div>
        <span class="job-owner-badge ${ownerClass}">${ownerLabel}</span>
      </div>
      <div class="job-card-schedule">
        <span class="job-schedule-badge">${escapeHtml(job.schedule_raw || '—')}</span>
        <span class="job-schedule-english">${escapeHtml(job.schedule_english || '')}</span>
      </div>
      <div class="job-source">${escapeHtml(job.source)}</div>
    </div>`;
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function fetchCron() {
    if (isStandalone) {
      renderSchedule(DEMO_CRON);
      return;
    }
    fetch('/api/cron')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { renderSchedule(data); })
      .catch(() => {});
  }

  fetchCron();
  setInterval(fetchCron, 30000);
</script>
</body>
</html>
