<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes AgentOS — Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a1a; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }

  .terminal-wrapper { display: flex; flex-direction: column; height: 100%; }
  #terminal-container { flex: 1; padding: 0; overflow: hidden; }

  /* Toolbar */
  .term-toolbar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(15,15,30,0.95); border-bottom: 1px solid #1e293b;
    padding: 6px 10px; font-size: 11px; color: #64748b;
    font-family: monospace;
  }
  .term-toolbar .title { color: #a78bfa; font-weight: 600; margin-right: auto; }
  .term-toolbar label { display: flex; align-items: center; gap: 4px; }
  .term-toolbar select, .term-toolbar input[type="range"] {
    background: rgba(255,255,255,0.05); border: 1px solid #334155;
    color: #94a3b8; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    font-family: monospace;
  }
  .term-toolbar select:focus, .term-toolbar input:focus { outline: none; border-color: #7c3aed; }
  .term-toolbar .status { display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-online { background: #10b981; }
  .dot-offline { background: #ef4444; }
  .dot-connecting { background: #f59e0b; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Skin presets */
  .skin-default { --bg: #0a0a1a; --fg: #e0e0e0; }
  .skin-dracula { --bg: #282a36; --fg: #f8f8f2; }
  .skin-nord { --bg: #2e3440; --fg: #d8dee9; }
  .skin-monokai { --bg: #272822; --fg: #f8f8f2; }
  .skin-gruvbox { --bg: #282828; --fg: #ebdbb2; }
  .skin-solarized { --bg: #002b36; --fg: #839496; }

  .xterm .xterm-viewport { background-color: transparent !important; }

  /* ── MOBILE RESPONSIVE ─────────────────────────────────── */
  /* Toolbar: collapse into a toggleable menu on small screens */
  .toolbar-toggle {
    display: none;
    background: rgba(139,92,246,0.15);
    border: 1px solid #7c3aed;
    color: #a78bfa;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-family: monospace;
  }

  @media (max-width: 768px) {
    .toolbar-toggle { display: inline-flex; }

    .term-toolbar {
      flex-wrap: wrap;
      padding: 4px 6px;
      gap: 4px;
    }

    .term-toolbar .title {
      width: 100%;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .term-toolbar label {
      font-size: 10px;
      gap: 2px;
    }

    .term-toolbar select,
    .term-toolbar input[type="range"] {
      font-size: 9px;
      padding: 1px 3px;
      max-width: 70px;
    }

    .term-toolbar input[type="range"] {
      width: 40px !important;
    }

    /* Hidden state — toolbar collapses to single row on mobile */
    .term-toolbar.collapsed .status,
    .term-toolbar.collapsed label,
    .term-toolbar.collapsed select,
    .term-toolbar.collapsed input {
      display: none;
    }
  }

  @media (max-width: 480px) {
    .term-toolbar select {
      max-width: 55px;
    }
    .term-toolbar label {
      font-size: 9px;
    }
    #terminal-container {
      font-size: 10px;
    }
  }

  /* Larger touch targets for mode toggle on mobile */
  @media (max-width: 768px) and (pointer: coarse) {
    .term-toolbar select,
    .term-toolbar input,
    .term-toolbar button,
    .toolbar-toggle {
      min-height: 32px;
      min-width: 32px;
    }
  }
</style>
</head>
<body class="skin-default">
<div class="terminal-wrapper">
  <div class="term-toolbar" id="termToolbar">
    <button class="toolbar-toggle" id="toolbarToggle" onclick="toggleToolbar()" title="Toggle controls">☰</button>
    <span class="title">⚡ TERMINAL</span>
    <span class="status">
      <span class="dot dot-connecting" id="connDot"></span>
      <span id="connText">connecting…</span>
    </span>
    <label>Theme
      <select id="skinSelect" onchange="setSkin(this.value)">
        <option value="default">Default</option>
        <option value="dracula">Dracula</option>
        <option value="nord">Nord</option>
        <option value="monokai">Monokai</option>
        <option value="gruvbox">Gruvbox</option>
        <option value="solarized">Solarized Dark</option>
      </select>
    </label>
    <label>Font
      <select id="fontSelect" onchange="setFont(this.value)">
        <option value="13">13px</option>
        <option value="11">11px</option>
        <option value="12">12px</option>
        <option value="14">14px</option>
        <option value="16">16px</option>
        <option value="18">18px</option>
      </select>
    </label>
    <label>Font Family
      <select id="fontFamilySelect" onchange="setFontFamily(this.value)">
        <option value="'JetBrains Mono',monospace">JetBrains Mono</option>
        <option value="'Fira Code',monospace">Fira Code</option>
        <option value="'Cascadia Code',monospace">Cascadia Code</option>
        <option value="'Source Code Pro',monospace">Source Code Pro</option>
        <option value="monospace">System Mono</option>
      </select>
    </label>
    <label>Opacity
      <input type="range" id="opacityRange" min="0.5" max="1" step="0.05" value="1" oninput="setOpacity(this.value)" style="width:60px;">
    </label>
    <select id="modeSelect" onchange="setMode(this.value)" title="Shell mode">
      <option value="bash">bash (shell)</option>
      <option value="hermes">hermes (AI chat)</option>
    </select>
  </div>
  <div id="terminal-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
(function() {
  // ── Skin definitions ──
  const SKINS = {
    default:  { bg:'#0a0a1a', fg:'#e0e0e0', cursor:'#00d4ff', sel:'rgba(0,212,255,0.2)',
                black:'#1a1a2e', red:'#ef4444', green:'#10b981', yellow:'#fbbf24', blue:'#3b82f6',
                magenta:'#a78bfa', cyan:'#22d3d8', white:'#e0e0e0', brightBlack:'#4b5563',
                brightRed:'#f87171', brightGreen:'#34d399', brightYellow:'#fcd34d', brightBlue:'#60a5fa',
                brightMagenta:'#c4b5fd', brightCyan:'#67e8f9', brightWhite:'#ffffff' },
    dracula:  { bg:'#282a36', fg:'#f8f8f2', cursor:'#f8f8f2', sel:'rgba(68,71,90,0.8)',
                black:'#21222c', red:'#ff5555', green:'#50fa7b', yellow:'#f1fa8c', blue:'#bd93f9',
                magenta:'#ff79c6', cyan:'#8be9fd', white:'#f8f8f2', brightBlack:'#6272a4',
                brightRed:'#ff6e6e', brightGreen:'#69ff94', brightYellow:'#ffffa5', brightBlue:'#d6acff',
                brightMagenta:'#ff92df', brightCyan:'#a4ffff', brightWhite:'#ffffff' },
    nord:     { bg:'#2e3440', fg:'#d8dee9', cursor:'#d8dee9', sel:'rgba(67,76,94,0.6)',
                black:'#3b4252', red:'#bf616a', green:'#a3be8c', yellow:'#ebcb8b', blue:'#81a1c1',
                magenta:'#b48ead', cyan:'#88c0d0', white:'#e5e9f0', brightBlack:'#4c566a',
                brightRed:'#bf616a', brightGreen:'#a3be8c', brightYellow:'#ebcb8b', brightBlue:'#81a1c1',
                brightMagenta:'#b48ead', brightCyan:'#8fbcbb', brightWhite:'#eceff4' },
    monokai:  { bg:'#272822', fg:'#f8f8f2', cursor:'#f8f8f2', sel:'rgba(73,72,62,0.9)',
                black:'#272822', red:'#f92672', green:'#a6e22e', yellow:'#f4bf75', blue:'#66d9ef',
                magenta:'#ae81ff', cyan:'#a1efe4', white:'#f8f8f2', brightBlack:'#75715e',
                brightRed:'#f92672', brightGreen:'#a6e22e', brightYellow:'#f4bf75', brightBlue:'#66d9ef',
                brightMagenta:'#ae81ff', brightCyan:'#a1efe4', brightWhite:'#f9f8f5' },
    gruvbox:  { bg:'#282828', fg:'#ebdbb2', cursor:'#ebdbb2', sel:'rgba(60,56,54,0.8)',
                black:'#282828', red:'#cc241d', green:'#98971a', yellow:'#d79921', blue:'#458588',
                magenta:'#b16286', cyan:'#689d6a', white:'#a89984', brightBlack:'#928374',
                brightRed:'#fb4934', brightGreen:'#b8bb26', brightYellow:'#fabd2f', brightBlue:'#83a598',
                brightMagenta:'#d3869b', brightCyan:'#8ec07c', brightWhite:'#ebdbb2' },
    solarized:{ bg:'#002b36', fg:'#839496', cursor:'#93a1a1', sel:'rgba(7,54,66,0.8)',
                black:'#073642', red:'#dc322f', green:'#859900', yellow:'#b58900', blue:'#268bd2',
                magenta:'#d33682', cyan:'#2aa198', white:'#eee8d5', brightBlack:'#586e75',
                brightRed:'#cb4b16', brightGreen:'#586e75', brightYellow:'#657b83', brightBlue:'#839496',
                brightMagenta:'#6c71c4', brightCyan:'#93a1a1', brightWhite:'#fdf6e3' },
  };

  // ── Terminal setup ──
  let currentFont = 13;
  let currentFamily = "'JetBrains Mono', monospace";

  function buildTheme(skin) {
    const s = SKINS[skin] || SKINS.default;
    return {
      background: s.bg, foreground: s.fg, cursor: s.cursor, selectionBackground: s.sel,
      black: s.black, red: s.red, green: s.green, yellow: s.yellow, blue: s.blue,
      magenta: s.magenta, cyan: s.cyan, white: s.white, brightBlack: s.brightBlack,
      brightRed: s.brightRed, brightGreen: s.brightGreen, brightYellow: s.brightYellow,
      brightBlue: s.brightBlue, brightMagenta: s.brightMagenta, brightCyan: s.brightCyan,
      brightWhite: s.brightWhite
    };
  }

  const term = new Terminal({
    cursorBlink: true,
    fontSize: currentFont,
    fontFamily: currentFamily,
    convertEol: true,
    scrollback: 10000,
    allowProposedApi: true,
    theme: buildTheme('default'),
  });

  // ── DEBUG: visible key event overlay ──
  const debugEl = document.createElement('div');
  debugEl.id = 'keyDebug';
  debugEl.style.cssText = 'position:fixed;top:4px;right:4px;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:11px;padding:6px 10px;border-radius:4px;z-index:9999;max-width:260px;white-space:pre-wrap;line-height:1.5;border:1px solid #333';
  debugEl.textContent = 'KEY DEBUG\npress any key...';
  document.body.appendChild(debugEl);
  const debugLog = [];
  function debugLogPush(s) {
    debugLog.push(s);
    if (debugLog.length > 8) debugLog.shift();
    debugEl.textContent = 'KEY DEBUG\n' + debugLog.join('\n');
  }
  window.addEventListener('keydown', (e) => {
    debugLogPush(`key="${e.key}" code="${e.code}" shift=${e.shiftKey}`);
  }, true);

  // Force US keyboard layout — some cloud VMs report wrong key maps
  // English-India digits should work, but just in case:
  const keyRemap = { '&': '1', 'é': '2', '"': '3', "'": '4', '(': '5', '-': '6', 'è': '7', '_': '8', 'ç': '9', 'à': '0' };
  term.attachCustomKeyEventHandler((e) => {
    if (e.type === 'keydown' && keyRemap[e.key]) {
      e.preventDefault();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(keyRemap[e.key]);
      }
      return false;
    }
    return true;
  });

  // Auto-focus the terminal container so keyboard input works immediately
  container.focus();
  term.focus();

  // Re-focus terminal when clicking anywhere in the wrapper
  container.addEventListener('click', () => term.focus());

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);

  const container = document.getElementById('terminal-container');
  term.open(container);
  fitAddon.fit();
  window.term = term;

  function fitTerminal() { fitAddon.fit(); }
  window.addEventListener('resize', fitTerminal);

  // ── Skin controls ──
  window.setSkin = function(name) {
    term.options.theme = buildTheme(name);
    document.body.className = 'skin-' + name;
  };

  window.setFont = function(size) {
    currentFont = parseInt(size);
    term.options.fontSize = currentFont;
    fitTerminal();
  };

  window.setFontFamily = function(family) {
    currentFamily = family;
    term.options.fontFamily = family;
    fitTerminal();
  };

  window.setOpacity = function(val) {
    container.style.opacity = val;
  };

  // ── Toolbar collapse for mobile ──
  let toolbarExpanded = false; // start collapsed on mobile, expanded on desktop
  function toggleToolbar() {
    const tb = document.getElementById('termToolbar');
    toolbarExpanded = !toolbarExpanded;
    tb.classList.toggle('collapsed', !toolbarExpanded);
  }
  // Auto-collapse on small screens at load
  function autoCollapseToolbar() {
    if (window.innerWidth <= 768) {
      toolbarExpanded = false;
      document.getElementById('termToolbar').classList.add('collapsed');
    } else {
      toolbarExpanded = true;
      document.getElementById('termToolbar').classList.remove('collapsed');
    }
  }
  window.addEventListener('resize', autoCollapseToolbar);
  autoCollapseToolbar();

  // ── WebSocket PTY connection ──
  const WS_PORT = 51765;
  let ws;
  let reconnectTimer;
  let mode = 'bash';

  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  const modeSelect = document.getElementById('modeSelect');

  function setConnStatus(state) {
    connDot.className = 'dot dot-' + state;
    if (state === 'online') connText.textContent = 'connected';
    else if (state === 'offline') connText.textContent = 'disconnected';
    else connText.textContent = 'connecting…';
  }

  function connect() {
    setConnStatus('connecting');
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.hostname}:${WS_PORT}`);

    ws.onopen = () => {
      setConnStatus('online');
      // Send initial resize
      const dims = fitAddon.proposeDimensions();
      if (dims) {
        ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
      }
      // If hermes mode, start hermes after connection
      if (mode === 'hermes') {
        setTimeout(() => ws.send('\n'), 500);
      }
    };

    ws.onmessage = (event) => {
      term.write(event.data);
    };

    ws.onclose = () => {
      setConnStatus('offline');
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      setConnStatus('offline');
    };
  }

  // Send input
  term.onData(data => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(data);
    }
  });

  // Resize handler
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      fitTerminal();
      const dims = fitAddon.proposeDimensions();
      if (dims && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
      }
    }, 200);
  });

  // Hermes mode
  window.setMode = function(m) {
    mode = m;
    if (m === 'hermes') {
      // Relaunch shell with hermes CLI
      if (ws && ws.readyState === WebSocket.OPEN) {
        // Exit current shell, start hermes
        ws.send('exit\n');
        setTimeout(() => ws.send('hermes\n'), 300);
      }
    } else {
      // Go back to bash
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('exit\n');
      }
    }
  };

  // Start
  connect();
})();
</script>
</body>
</html>
