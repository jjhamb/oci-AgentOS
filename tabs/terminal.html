<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes AgentOS — Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a1a; color: #e0e0e0; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  #terminal-container { width: 100%; height: 100%; padding: 4px; }
  .terminal-info {
    position: fixed; top: 8px; right: 12px; z-index: 100;
    font-size: 10px; color: #444; font-family: monospace;
    background: rgba(10,10,26,0.85); padding: 4px 10px; border-radius: 6px;
    border: 1px solid #1e293b;
  }
  .terminal-info .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .dot-online { background: #10b981; }
  .dot-offline { background: #ef4444; }
  #hermes-panel {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.95); border-top: 1px solid #1e293b;
    padding: 12px 16px; font-size: 12px; color: #94a3b8;
    font-family: monospace; max-height: 40%; overflow-y: auto;
  }
  #hermes-panel.visible { display: block; }
  #hermes-panel .hermes-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  #hermes-panel .hermes-log { color: #e2e8f0; white-space: pre-wrap; line-height: 1.4; }
  .hermes-btn {
    font-size: 10px; padding: 3px 10px; border-radius: 4px;
    border: 1px solid #334155; background: rgba(255,255,255,0.05);
    color: #94a3b8; cursor: pointer;
  }
  .hermes-btn:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
</style>
</head>
<body>
<div id="terminal-container"></div>

<div class="terminal-info" id="connStatus">
  <span class="dot dot-online" id="connDot"></span>
  <span id="connText">connecting…</span>
</div>

<div id="hermes-panel">
  <div class="hermes-header">
    <span style="color:#a78bfa;">⚡ Hermes Agent Session</span>
    <div>
      <button class="hermes-btn" id="hermesStart">Start</button>
      <button class="hermes-btn" id="hermesClose" style="margin-left:4px;">Close</button>
    </div>
  </div>
  <div class="hermes-log" id="hermesLog"></div>
</div>

<!-- xterm.js via CDN — only dependency -->
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
(function() {
  const term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
    convertEol: true,
    theme: {
      background: '#0a0a1a',
      foreground: '#e0e0e0',
      cursor: '#00d4ff',
      selection: 'rgba(0,212,255,0.2)',
      black: '#1a1a2e',
      red: '#ef4444',
      green: '#10b981',
      yellow: '#fbbf24',
      blue: '#3b82f6',
      magenta: '#a78bfa',
      cyan: '#22d3d8',
      white: '#e0e0e0',
      brightBlack: '#4b5563',
      brightRed: '#f87171',
      brightGreen: '#34d399',
      brightYellow: '#fcd34d',
      brightBlue: '#60a5fa',
      brightMagenta: '#c4b5fd',
      brightCyan: '#67e8f9',
      brightWhite: '#ffffff'
    },
    scrollback: 5000,
    allowProposedApi: true
  });

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);

  const container = document.getElementById('terminal-container');
  term.open(container);

  // Expose for debugging
  window.term = term;

  function fitTerminal() {
    fitAddon.fit();
  }

  fitTerminal();

  window.addEventListener('resize', fitTerminal);

  // State
  let cwd = '/home/jayant';
  let busy = false;
  let cmdBuffer = '';
  let cursorPos = 0;
  let history = [];
  let historyIdx = -1;

  // Connect status
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');
  let hasFocus = false;

  function setConnStatus(online) {
    connDot.className = 'dot ' + (online ? 'dot-online' : 'dot-offline');
    connText.textContent = online ? 'online (' + cwd + ')' : 'offline';
  }

  // Initial prompt
  function writePrompt() {
    term.write('\r\x1b[0m\x1b[36m➜\x1b[0m \x1b[34m' + cwd + '\x1b[0m \x1b[32m$\x1b[0m ');
    cmdBuffer = '';
    cursorPos = 0;
  }

  writePrompt();
  setConnStatus(true);

  // Process a command
  async function runCommand(raw) {
    const cmd = raw.trim();
    if (!cmd) { writePrompt(); return; }

    // Built-in: cd
    if (cmd === 'cd' || cmd.startsWith('cd ')) {
      const target = cmd.slice(2).trim() || '/home/jayant';
      try {
        const resp = await fetch('/api/terminal/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: 'cd ' + target + ' && pwd', cwd })
        });
        const data = await resp.json();
        if (data.exit_code === 0) {
          cwd = data.stdout.trim();
          setConnStatus(true);
        } else {
          term.write('\r\n  \x1b[31m' + (data.stderr || 'no such directory') + '\x1b[0m');
        }
      } catch(e) {
        term.write('\r\n  \x1b[31m' + e.message + '\x1b[0m');
      }
      writePrompt();
      return;
    }

    // Built-in: clear
    if (cmd === 'clear') {
      term.clear();
      writePrompt();
      return;
    }

    // Built-in: exit
    if (cmd === 'exit') {
      term.write('\r\n  \x1b[33m(embedded terminal — close tab to exit)\x1b[0m');
      writePrompt();
      return;
    }

    // Send to server
    busy = true;
    term.write('\r\n');
    try {
      const resp = await fetch('/api/terminal/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd, cwd })
      });
      const data = await resp.json();

      if (data.stdout) term.write(data.stdout);
      if (data.stderr) term.write('\x1b[31m' + data.stderr + '\x1b[0m');
      if (data.exit_code !== 0 && data.exit_code !== undefined && !data.stdout && !data.stderr) {
        term.write('  \x1b[33mexit: ' + data.exit_code + '\x1b[0m');
      }
    } catch(e) {
      term.write('\r\n  \x1b[31m' + e.message + '\x1b[0m');
      setConnStatus(false);
    }
    busy = false;
    writePrompt();
  }

  // Input handling
  term.onData(data => {
    if (busy) return;

    const code = data.charCodeAt(0);

    if (data === '\r') { // Enter
      term.write('\r\n');
      history.unshift(cmdBuffer);
      if (history.length > 200) history.pop();
      historyIdx = -1;
      runCommand(cmdBuffer);
      return;
    }

    if (data === '\x7f') { // Backspace
      if (cursorPos > 0) {
        cmdBuffer = cmdBuffer.slice(0, cursorPos - 1) + cmdBuffer.slice(cursorPos);
        cursorPos--;
        term.write('\x1b[1D\x1b[0K' + cmdBuffer.slice(cursorPos));
        term.write('\x1b[' + (cmdBuffer.length - cursorPos) + 'D');
      }
      return;
    }

    if (data === '\x1b[A') { // Up arrow
      if (historyIdx < history.length - 1) {
        historyIdx++;
        cmdBuffer = history[historyIdx];
        cursorPos = cmdBuffer.length;
        term.write('\r\x1b[2K');
        writePromptRaw();
      }
      return;
    }

    if (data === '\x1b[B') { // Down arrow
      if (historyIdx > 0) {
        historyIdx--;
        cmdBuffer = history[historyIdx];
      } else {
        historyIdx = -1;
        cmdBuffer = '';
      }
      cursorPos = cmdBuffer.length;
      term.write('\r\x1b[2K');
      writePromptRaw();
      return;
    }

    if (data === '\x1b[C') { // Right arrow
      if (cursorPos < cmdBuffer.length) {
        cursorPos++;
        term.write('\x1b[1C');
      }
      return;
    }

    if (data === '\x1b[D') { // Left arrow
      if (cursorPos > 0) {
        cursorPos--;
        term.write('\x1b[1D');
      }
      return;
    }

    // Regular character
    cmdBuffer = cmdBuffer.slice(0, cursorPos) + data + cmdBuffer.slice(cursorPos);
    cursorPos++;
    term.write('\x1b[0K' + cmdBuffer.slice(cursorPos - 1));
    if (cursorPos < cmdBuffer.length) {
      term.write('\x1b[' + (cmdBuffer.length - cursorPos) + 'D');
    }
  });

  function writePromptRaw() {
    term.write('\x1b[36m➜\x1b[0m \x1b[34m' + cwd + '\x1b[0m \x1b[32m$\x1b[0m ' + cmdBuffer);
  }

  // --- Hermes Agent Session Panel ---
  const hermesPanel = document.getElementById('hermes-panel');
  const hermesLog = document.getElementById('hermesLog');
  const hermesStart = document.getElementById('hermesStart');
  const hermesClose = document.getElementById('hermesClose');

  hermesStart.addEventListener('click', async () => {
    hermesPanel.classList.add('visible');
    hermesLog.textContent = 'Starting Hermes session…\n';
    try {
      const resp = await fetch('/api/terminal/hermes/start', { method: 'POST' });
      const data = await resp.json();
      hermesLog.textContent += data.message + '\n';
    } catch(e) {
      hermesLog.textContent += 'Error: ' + e.message + '\n';
    }
  });

  hermesClose.addEventListener('click', () => {
    hermesPanel.classList.remove('visible');
  });

  // Draggable resize
  window.addEventListener('resize', () => fitAddon.fit());

})();
</script>
</body>
</html>
