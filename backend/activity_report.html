}

function statusClass(status) {
  if (status === 'completed') return 'status-completed';
  if (status === 'in_progress' || status === 'running') return 'status-in_progress';
  return '';
}

function renderRow(e) {
  const time = e.created_at ? e.created_at.slice(11,16) : '—';
  const agent = e.agent_name || 'unknown';
  const source = isKanbanEntry(e) ? '<span class="kanban-badge">K</span>' : '<span class="log-badge">L</span>';
  const status = e.status || '—';
  const desc = (e.task_description || '—').substring(0, 60);

  return `<tr>
    <td class="time">${time}</td>
    <td class="agent ${agentClass(agent)}">${agent}</td>
    <td class="source">${source}</td>
    <td class="status ${statusClass(status)}">${status}</td>
    <td class="desc" title="${e.task_description || ''}">${desc}</td>
  </tr>`;
}

function renderTable(data, cycleFilter) {
  const recent = data.recent || [];
  // Filter to cycle 1 entries or all non-test entries
  let filtered = recent;
  if (cycleFilter) {
    filtered = recent.filter(e => 
      (e.task_description && e.task_description.includes(cycleFilter)) ||
      (e.id && e.id.toString().includes(cycleFilter))
    );
  }
  // Sort by created_at DESC
  filtered.sort((a, b) => {
    const ta = a.created_at || '';
    const tb = b.created_at || '';
    return tb.localeCompare(ta);
  });
  return filtered.map(renderRow).join('');
}

document.getElementById('genTime').textContent = new Date().toLocaleTimeString();
document.getElementById('agentsTab').innerHTML = renderTable(ACTIVITY_DATA, 'C1');
document.getElementById('overviewTab').innerHTML = renderTable(ACTIVITY_DATA, 'C1');

// Summary stats
const recent = ACTIVITY_DATA.recent || [];
const c1Entries = recent.filter(e => (e.task_description && e.task_description.includes('C1')) || (e.id && e.id.toString().includes('c1')));
const agents = [...new Set(c1Entries.map(e => e.agent_name))];
const kanbanCount = c1Entries.filter(isKanbanEntry).length;
const logCount = c1Entries.length - kanbanCount;

document.getElementById('summary').innerHTML = `
  <span>📊 ${c1Entries.length} total entries</span>
  <span>🤖 ${agents.length}/11 agents</span>
  <span>📋 ${kanbanCount} kanban-injected</span>
  <span>📝 ${logCount} agent-logs</span>
  <span>✅ Sort: time-descending</span>
`;
</script>
